# 外设水库 · 定时自动化流水线
# 无人值守：定时（或手动触发）执行 分类→品牌核验→产品核验→新品发现→入库，
# 有数据变更则自动提交，触发 GitHub Pages 重新部署。
name: Sync peripheral database

on:
  schedule:
    - cron: "30 */6 * * *"   # 每 6 小时一次（可按需改，如 "0 3 * * *" 每天凌晨）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (classify → verify → discover → ingest)
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python -m pipeline.run full --limit-brands 30 --limit 20

      - name: Commit data updates
        run: |
          git config user.name "waishui-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): auto sync $(date -u +%Y-%m-%d)"
            git push
          fi
