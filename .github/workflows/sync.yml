# 外设水库 · 自动化流水线
# push 到 main（非 data/）→ 全量模式 mass（核验全部品牌+全量发现+图片参数补全）
# 定时触发 → 增量模式 full；数据由机器人提交，data/ 变更不会再次触发（防循环）
name: Sync peripheral database

on:
  schedule:
    - cron: "30 */6 * * *"   # 每 6 小时一次（可按需改，如 "0 3 * * *" 每天凌晨）
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-db
  cancel-in-progress: false   # 同时只跑一个同步任务，新触发排队等待，避免提交冲突

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (push → mass / schedule → incremental)
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m pipeline.run mass --limit 3000
          else
            python -m pipeline.run full --limit-brands 45 --limit 30 --enrich-limit 2000
          fi

      - name: Commit data updates
        run: |
          git config user.name "waishui-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): auto sync $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push
          fi
